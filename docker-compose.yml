version: '3.8'
services:
  pgdb:
    image: postgres:16
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 2s
      timeout: 3s
      retries: 10
  backend:
    build: ./
    env_file: .env
    volumes:
      - ./:/app
    ports:
      - 8000:8000
    depends_on:
      pgdb:
        condition: service_healthy
  alembic:
    build: ./
    env_file: .env
    entrypoint: ['alembic']
    command: ['upgrade', 'head']
    depends_on:
      pgdb:
        condition: service_healthy
  create-admin:
    build: ./
    env_file: .env
    command: python -m scripts.create_admin
    depends_on:
      pgdb:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
volumes:
  pg_data: